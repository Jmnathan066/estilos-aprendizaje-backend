services:
  - type: web
    name: estilos-aprendizaje-api
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - { key: APP_ENV, value: production }
      - { key: APP_DEBUG, value: "false" }
      - { key: APP_KEY, sync: false }          # php artisan key:generate --show
      - { key: APP_URL, sync: false }
      - { key: DB_CONNECTION, value: pgsql }
      - { key: DB_URL, sync: false }                 # cadena de conexión de Neon (sslmode=require)
      - { key: SESSION_DRIVER, value: array }
      - { key: CACHE_STORE, value: file }
      - { key: QUEUE_CONNECTION, value: sync }
      - { key: LOG_CHANNEL, value: stderr }
      - { key: CORS_ALLOWED_ORIGINS, sync: false }   # https://tu-app.vercel.app
      - { key: PROFESOR_USER, sync: false }
      - { key: PROFESOR_PASS, sync: false }
      - { key: BREVO_API_KEY, sync: false }
      - { key: MAIL_FROM_ADDRESS, sync: false }      # remitente verificado en Brevo
      - { key: MAIL_FROM_NAME, value: Estilos de Aprendizaje }
